replicaCount: 1

image:
  imagePullSecretName: ecr-creds
  repository: 782197776658.dkr.ecr.us-east-1.amazonaws.com/madmeme/backend
  pullPolicy: IfNotPresent
  tag:

imgFlipUsername:
imgFlipPassword:
apiNinjasKey:

ingress:
  enabled: true
  host:
  prefix:
  tls:
    enabled: true
    secretName: ingress-cert

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 25m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /ping
    port: http
readinessProbe:
  httpGet:
    path: /ping
    port: http

mongo:
  pvc:
    size: 10Gi
